<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Quality Study</title>
<style>
body{background:#0b0f17;color:#fff;font-family:sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col{display:grid;gap:20px}
.card{background:#121a2a;padding:10px;border-radius:10px}
video{width:100%}
.rating{margin-top:10px}
</style>
</head>

<body>

<h2>Video Quality Study</h2>
<p>Please watch all videos and rate each from 1 to 5.</p>

<div class="grid">

<div class="col">
<div class="card">
<h3>Video 1</h3>
<video id="v1" controls src="你的video1"></video>
<div class="rating">
<input type="radio" name="s1" value="1">1
<input type="radio" name="s1" value="2">2
<input type="radio" name="s1" value="3">3
<input type="radio" name="s1" value="4">4
<input type="radio" name="s1" value="5">5
</div>
</div>

<div class="card">
<h3>Video 2</h3>
<video controls src="你的video2"></video>
<div class="rating">
<input type="radio" name="s2" value="1">1
<input type="radio" name="s2" value="2">2
<input type="radio" name="s2" value="3">3
<input type="radio" name="s2" value="4">4
<input type="radio" name="s2" value="5">5
</div>
</div>

<div class="card">
<h3>Video 3</h3>
<video controls src="你的video3"></video>
<div class="rating">
<input type="radio" name="s3" value="1">1
<input type="radio" name="s3" value="2">2
<input type="radio" name="s3" value="3">3
<input type="radio" name="s3" value="4">4
<input type="radio" name="s3" value="5">5
</div>
</div>

<div class="card">
<h3>Video 4</h3>
<video controls src="你的video4"></video>
<div class="rating">
<input type="radio" name="s4" value="1">1
<input type="radio" name="s4" value="2">2
<input type="radio" name="s4" value="3">3
<input type="radio" name="s4" value="4">4
<input type="radio" name="s4" value="5">5
</div>
</div>
</div>

<div class="col">
<div class="card">
<h3>Video 5</h3>
<video controls src="你的video5"></video>
<div class="rating">
<input type="radio" name="s5" value="1">1
<input type="radio" name="s5" value="2">2
<input type="radio" name="s5" value="3">3
<input type="radio" name="s5" value="4">4
<input type="radio" name="s5" value="5">5
</div>
</div>

<div class="card">
<h3>Video 6</h3>
<video controls src="你的video6"></video>
<div class="rating">
<input type="radio" name="s6" value="1">1
<input type="radio" name="s6" value="2">2
<input type="radio" name="s6" value="3">3
<input type="radio" name="s6" value="4">4
<input type="radio" name="s6" value="5">5
</div>
</div>

<div class="card">
<h3>Video 7</h3>
<video controls src="你的video7"></video>
<div class="rating">
<input type="radio" name="s7" value="1">1
<input type="radio" name="s7" value="2">2
<input type="radio" name="s7" value="3">3
<input type="radio" name="s7" value="4">4
<input type="radio" name="s7" value="5">5
</div>
</div>
</div>

</div>

<br>
<button onclick="submitAll()">Submit</button>

<script>
function getScore(i){
  const r = document.querySelector(`input[name="s${i}"]:checked`);
  return r ? r.value : null;
}

function generateCode(){
  return "mtvideo" + Math.floor(Math.random()*100000).toString().padStart(5,'0');
}

function submitAll(){
  let scores = [];
  for(let i=1;i<=7;i++){
    let s = getScore(i);
    if(!s){
      alert("Please rate all videos");
      return;
    }
    scores.push(s);
  }

  let code = generateCode();

  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf4YDJ0sZQEpiDz4M4VXZa9PGACwS4AP4qNn423l_bficFiAw/formResponse";

  const data = new FormData();
  data.append("entry.16441556", scores[0]);
  data.append("entry.2025751820", scores[1]);
  data.append("entry.1793582851", scores[2]);
  data.append("entry.458650404", scores[3]);
  data.append("entry.1719923684", scores[4]);
  data.append("entry.418349952", scores[5]);
  data.append("entry.1934328220", scores[6]);
  data.append("entry.1290720256", code);

  fetch(formUrl, {method:"POST",mode:"no-cors",body:data});

  document.body.innerHTML = `
    <h2>Thank you!</h2>
    <p>Your completion code:</p>
    <h1>${code}</h1>
  `;
}
</script>

</body>
</html>

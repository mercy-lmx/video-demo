<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Quality Study</title>

<style>
body{
  background:#0b0f17;
  color:#fff;
  font-family:Arial, sans-serif;
  margin:24px;
}

h2{
  margin-bottom:8px;
}

p{
  color:#d0d6e6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
  margin-top:22px;
}

.card{
  background:#121a2a;
  padding:12px;
  border-radius:12px;
}

.card h3{
  margin-top:0;
  margin-bottom:10px;
}

iframe{
  width:100%;
  height:220px;
  border:0;
  border-radius:8px;
  background:#000;
}

.rating{
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.rating label{
  cursor:pointer;
}

button{
  margin-top:26px;
  padding:12px 22px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#7aa2ff;
  color:#fff;
  font-weight:bold;
}

button:hover{
  background:#5f86e8;
}

@media(max-width:1100px){
  .grid{
    grid-template-columns:repeat(2, 1fr);
  }
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h2>Video Quality Study</h2>

<p>
Please watch all videos carefully and rate each video from 1 to 5 based on your overall viewing experience.
</p>

<p>
1 = Bad, 2 = Poor, 3 = Fair, 4 = Good, 5 = Excellent.
</p>

<div class="grid">

  <div class="card">
    <h3>Video 1</h3>
    <iframe src="https://drive.google.com/file/d/1lnt-nikSuN7Uy7np2zZ0HgYkgZXPAw8h/preview" allow="autoplay" allowfullscreen></iframe>
    <div class="rating">
      <label><input type="radio" name="s1" value="1"> 1</label>
      <label><input type="radio" name="s1" value="2"> 2</label>
      <label><input type="radio" name="s1" value="3"> 3</label>
      <label><input type="radio" name="s1" value="4"> 4</label>
      <label><input type="radio" name="s1" value="5"> 5</label>
    </div>
  </div>

  <div class="card">
    <h3>Video 2</h3>
    <iframe src="https://drive.google.com/file/d/1HQhNiC-TO_wZGufliAn1LU3MdEia0Ll_/preview" allow="autoplay" allowfullscreen></iframe>
    <div class="rating">
      <label><input type="radio" name="s2" value="1"> 1</label>
      <label><input type="radio" name="s2" value="2"> 2</label>
      <label><input type="radio" name="s2" value="3"> 3</label>
      <label><input type="radio" name="s2" value="4"> 4</label>
      <label><input type="radio" name="s2" value="5"> 5</label>
    </div>
  </div>

  <div class="card">
    <h3>Video 3</h3>
    <iframe src="https://drive.google.com/file/d/1KlmCz28oHYFXhjMpsdRMEDh4VBHtKkIU/preview" allow="autoplay" allowfullscreen></iframe>
    <div class="rating">
      <label><input type="radio" name="s3" value="1"> 1</label>
      <label><input type="radio" name="s3" value="2"> 2</label>
      <label><input type="radio" name="s3" value="3"> 3</label>
      <label><input type="radio" name="s3" value="4"> 4</label>
      <label><input type="radio" name="s3" value="5"> 5</label>
    </div>
  </div>

  <div class="card">
    <h3>Video 4</h3>
    <iframe src="https://drive.google.com/file/d/1YDMqZiO9EOrTFC_WWexHSb2Cpnojsnqv/preview" allow="autoplay" allowfullscreen></iframe>
    <div class="rating">
      <label><input type="radio" name="s4" value="1"> 1</label>
      <label><input type="radio" name="s4" value="2"> 2</label>
      <label><input type="radio" name="s4" value="3"> 3</label>
      <label><input type="radio" name="s4" value="4"> 4</label>
      <label><input type="radio" name="s4" value="5"> 5</label>
    </div>
  </div>

  <div class="card">
    <h3>Video 5</h3>
    <iframe src="https://drive.google.com/file/d/1rLmSAImpVye4xbsGipcSdDlA9J36tL2I/preview" allow="autoplay" allowfullscreen></iframe>
    <div class="rating">
      <label><input type="radio" name="s5" value="1"> 1</label>
      <label><input type="radio" name="s5" value="2"> 2</label>
      <label><input type="radio" name="s5" value="3"> 3</label>
      <label><input type="radio" name="s5" value="4"> 4</label>
      <label><input type="radio" name="s5" value="5"> 5</label>
    </div>
  </div>

  <div class="card">
    <h3>Video 6</h3>
    <iframe src="https://drive.google.com/file/d/1SZSlJF5LqIwAOXLWqrHaIHSYQEHiqqzi/preview" allow="autoplay" allowfullscreen></iframe>
    <div class="rating">
      <label><input type="radio" name="s6" value="1"> 1</label>
      <label><input type="radio" name="s6" value="2"> 2</label>
      <label><input type="radio" name="s6" value="3"> 3</label>
      <label><input type="radio" name="s6" value="4"> 4</label>
      <label><input type="radio" name="s6" value="5"> 5</label>
    </div>
  </div>

  <div class="card">
    <h3>Video 7</h3>
    <iframe src="https://drive.google.com/file/d/1oQs2GIUtnh6Xur_iTG1acVzxk93cd7Xh/preview" allow="autoplay" allowfullscreen></iframe>
    <div class="rating">
      <label><input type="radio" name="s7" value="1"> 1</label>
      <label><input type="radio" name="s7" value="2"> 2</label>
      <label><input type="radio" name="s7" value="3"> 3</label>
      <label><input type="radio" name="s7" value="4"> 4</label>
      <label><input type="radio" name="s7" value="5"> 5</label>
    </div>
  </div>

</div>

<button onclick="submitAll()">Submit</button>

<script>
function getScore(i){
  const r = document.querySelector(`input[name="s${i}"]:checked`);
  return r ? r.value : null;
}

function generateCode(){
  const timePart = Date.now().toString().slice(-6);
  const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
  return "mtvideo" + timePart + randomPart;
}

function submitAll(){
  const scores = [];

  for(let i = 1; i <= 7; i++){
    const s = getScore(i);
    if(!s){
      alert("Please rate all videos before submitting.");
      return;
    }
    scores.push(s);
  }

  const code = generateCode();

  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf4YDJ0sZQEpiDz4M4VXZa9PGACwS4AP4qNn423l_bficFiAw/formResponse";

  const data = new FormData();
  data.append("entry.16441556", scores[0]);
  data.append("entry.2025751820", scores[1]);
  data.append("entry.1793582851", scores[2]);
  data.append("entry.458650404", scores[3]);
  data.append("entry.1719923684", scores[4]);
  data.append("entry.418349952", scores[5]);
  data.append("entry.1934328220", scores[6]);
  data.append("entry.1290720256", code);

  fetch(formUrl, {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  document.body.innerHTML = `
    <div style="max-width:720px;margin:80px auto;text-align:center;font-family:Arial,sans-serif;color:white;">
      <h2>Thank you!</h2>
      <p>Please copy the following completion code and submit it on MTurk.</p>
      <h1 style="font-size:42px;">${code}</h1>
    </div>
  `;
}
</script>

</body>
</html>

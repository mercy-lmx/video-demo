<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Quality Study</title>
<style>
body{background:#0b0f17;color:#fff;font-family:Arial,sans-serif;margin:24px}
p{color:#d0d6e6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:22px}
.card{background:#121a2a;padding:12px;border-radius:12px}
video{width:100%;height:220px;background:#000;border-radius:8px}
.rating{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
button{margin-top:24px;padding:12px 22px;font-size:16px;border:none;border-radius:8px;cursor:pointer;background:#7aa2ff;color:white;font-weight:bold}
button:disabled{background:#555;cursor:not-allowed}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<h2>Video Quality Study</h2>
<p>Please wait until all videos are loaded, then click Play All to watch them together.</p>
<p>Please rate each video from 1 to 5 based on your overall viewing experience.</p>
<p>1 = Bad, 2 = Poor, 3 = Fair, 4 = Good, 5 = Excellent.</p>

<button id="playAllBtn" disabled>Loading videos...</button>

<div class="grid" id="grid"></div>

<button onclick="submitAll()">Submit</button>

<script>
const videoIds = [
  "1lnt-nikSuN7Uy7np2zZ0HgYkgZXPAw8h",
  "1HQhNiC-TO_wZGufliAn1LU3MdEia0Ll_",
  "1KlmCz28oHYFXhjMpsdRMEDh4VBHtKkIU",
  "1YDMqZiO9EOrTFC_WWexHSb2Cpnojsnqv",
  "1rLmSAImpVye4xbsGipcSdDlA9J36tL2I",
  "1SZSlJF5LqIwAOXLWqrHaIHSYQEHiqqzi",
  "1oQs2GIUtnh6Xur_iTG1acVzxk93cd7Xh"
];

const grid = document.getElementById("grid");

videoIds.forEach((id, idx) => {
  const i = idx + 1;
  grid.innerHTML += `
    <div class="card">
      <h3>Video ${i}</h3>
      <video id="v${i}" controls preload="auto" playsinline>
        <source src="https://drive.google.com/uc?export=download&id=${id}" type="video/mp4">
      </video>
      <div class="rating">
        <label><input type="radio" name="s${i}" value="1">1</label>
        <label><input type="radio" name="s${i}" value="2">2</label>
        <label><input type="radio" name="s${i}" value="3">3</label>
        <label><input type="radio" name="s${i}" value="4">4</label>
        <label><input type="radio" name="s${i}" value="5">5</label>
      </div>
    </div>
  `;
});

const videos = Array.from(document.querySelectorAll("video"));
const playAllBtn = document.getElementById("playAllBtn");

let loadedCount = 0;

videos.forEach(v => {
  v.addEventListener("canplaythrough", () => {
    loadedCount++;
    if (loadedCount >= videos.length) {
      playAllBtn.disabled = false;
      playAllBtn.textContent = "Play All";
    }
  }, { once:true });
});

setTimeout(() => {
  playAllBtn.disabled = false;
  playAllBtn.textContent = "Play All";
}, 10000);

playAllBtn.onclick = async function(){
  videos.forEach(v => {
    v.pause();
    v.currentTime = 0;
    v.muted = true;
  });

  await Promise.allSettled(videos.map(v => v.play()));

  videos[0].muted = false;
};

function getScore(i){
  const r = document.querySelector(`input[name="s${i}"]:checked`);
  return r ? r.value : null;
}

function generateCode(){
  const timePart = Date.now().toString().slice(-6);
  const randomPart = Math.random().toString(36).substring(2,6).toUpperCase();
  return "mtvideo" + timePart + randomPart;
}

function submitAll(){
  const scores = [];

  for(let i = 1; i <= 7; i++){
    const s = getScore(i);
    if(!s){
      alert("Please rate all videos before submitting.");
      return;
    }
    scores.push(s);
  }

  const code = generateCode();

  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf4YDJ0sZQEpiDz4M4VXZa9PGACwS4AP4qNn423l_bficFiAw/formResponse";

  const data = new FormData();
  data.append("entry.16441556", scores[0]);
  data.append("entry.2025751820", scores[1]);
  data.append("entry.1793582851", scores[2]);
  data.append("entry.458650404", scores[3]);
  data.append("entry.1719923684", scores[4]);
  data.append("entry.418349952", scores[5]);
  data.append("entry.1934328220", scores[6]);
  data.append("entry.1290720256", code);

  fetch(formUrl, {method:"POST",mode:"no-cors",body:data});

  document.body.innerHTML = `
    <div style="max-width:720px;margin:80px auto;text-align:center;font-family:Arial,sans-serif;color:white;">
      <h2>Thank you!</h2>
      <p>Please copy the following completion code and submit it on MTurk.</p>
      <h1 style="font-size:42px;">${code}</h1>
    </div>
  `;
}
</script>

</body>
</html>

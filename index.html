<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Demo</title>
  <meta name="description" content="Masquer" />
  <style>
    :root{
      --bg:#0b0f17;
      --card:#121a2a;
      --text:#e8eefc;
      --muted:#a9b6d3;
      --line:rgba(255,255,255,.10);
      --accent:#7aa2ff;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius:16px;
      --max: 980px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 700px at 20% -10%, rgba(122,162,255,.25), transparent 60%),
                  radial-gradient(900px 600px at 90% 0%, rgba(90,255,220,.12), transparent 55%),
                  var(--bg);
      color:var(--text);
      line-height:1.55;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}
    header{
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(11,15,23,.65);
      border-bottom:1px solid var(--line);
    }
    .nav{
      max-width:var(--max);
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
    }
    .brand{
      display:flex; gap:10px; align-items:center;
      font-weight:700;
    }
    .dot{
      width:10px; height:10px; border-radius:99px;
      background: linear-gradient(135deg, #7aa2ff, #5affdc);
      box-shadow: 0 0 0 4px rgba(122,162,255,.14);
    }
    .links{display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end}
    .links a{
      padding:8px 10px;
      border:1px solid transparent;
      border-radius:999px;
      color:var(--muted);
    }
    .links a:hover{
      border-color: var(--line);
      color: var(--text);
      text-decoration:none;
      background: rgba(255,255,255,.04);
    }

    main{max-width:var(--max); margin:0 auto; padding:26px 18px 60px}
    .hero{
      display:grid;
      gap:14px;
      margin-top:8px;
    }
    .title{
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 800;
      letter-spacing:.2px;
    }
    .subtitle{
      color:var(--muted);
      max-width: 78ch;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
      align-items:center;
    }
    button{
      appearance:none;
      border:1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding:9px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:650;
    }
    button:hover{background: rgba(255,255,255,.08)}

    /* ✅ 关键：2 行 3 列，6 个视频填满 */
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:18px;
      margin-top:18px;
      grid-template-areas:
        "v1 v2 v3"
        "v4 v5 v6";
    }
    .card.v1{grid-area:v1;}
    .card.v2{grid-area:v2;}
    .card.v3{grid-area:v3;}
    .card.v4{grid-area:v4;}
    .card.v5{grid-area:v5;}
    .card.v6{grid-area:v6;}

    @media (max-width: 920px){
      .grid{
        grid-template-columns: 1fr;
        grid-template-areas:
          "v1"
          "v2"
          "v3"
          "v4"
          "v5"
          "v6";
      }
    }

    .card{
      background: rgba(18,26,42,.86);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .hd{
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--line);
    }
    .card .hd .h{
      font-weight:800;
      letter-spacing:.2px;
    }
    .card .bd{padding:14px 16px}
    .small{color:var(--muted); font-size:14px}
    video{
      width:100%;
      height:auto;
      display:block;
      background:#000;
      aspect-ratio: 16 / 9;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.65);
      border:1px solid var(--line);
      color: var(--text);
      display:none;
      z-index: 999;
    }
  </style>
</head>

<body>
<header>
  <div class="nav">
    <div class="brand">
      <span class="dot"></span>
      <span>Video Demo</span>
    </div>
    <div class="links">
      <a href="#demo">Demo</a>
      <a href="#highlights">Highlights</a>
      <a href="#setup">Setup</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="title">Masquer</div>
    <div class="subtitle">video demo</div>

    <div class="controls">
      <button id="btnPlayAll">全部播放</button>
      <button id="btnPauseAll">全部暂停</button>
      <button id="btnSyncTo1">同步到 masq</button>
      <button id="btnResetAll">全部回到开头</button>
    </div>
  </section>

  <div class="grid" id="demo">
    <div class="card v1">
      <div class="hd">
        <div class="h">masq</div>
        <div class="small" id="videoLabel1">masq_100ms.mp4</div>
      </div>
      <video id="player1" controls playsinline preload="metadata">
        <source src="https://github.com/mercy-lmx/video-demo/releases/download/v1/masq_100ms.mp4?raw=1" type="video/mp4" />
        你的浏览器不支持 HTML5 video。
      </video>
    </div>

    <div class="card v2">
      <div class="hd">
        <div class="h">Tooth</div>
        <div class="small" id="videoLabel2">tooth_100ms.mp4</div>
      </div>
      <video id="player2" controls playsinline preload="metadata">
        <source src="https://github.com/mercy-lmx/video-demo/releases/download/v1/tooth_100ms.mp4?raw=1" type="video/mp4" />
        你的浏览器不支持 HTML5 video。
      </video>
    </div>

    <div class="card v3">
      <div class="hd">
        <div class="h">Tambur</div>
        <div class="small" id="videoLabel3">tambur_100ms.mp4</div>
      </div>
      <video id="player3" controls playsinline preload="metadata">
        <source src="https://github.com/mercy-lmx/video-demo/releases/download/v1/tambur_100ms.mp4?raw=1" type="video/mp4" />
        你的浏览器不支持 HTML5 video。
      </video>
    </div>

    <div class="card v4">
      <div class="hd">
        <div class="h">Sample</div>
        <div class="small" id="videoLabel4">sample.mp4</div>
      </div>
      <video id="player4" controls playsinline preload="metadata">
        <source src="https://github.com/mercy-lmx/video-demo/releases/download/v1/sample.mp4?raw=1" type="video/mp4" />
        你的浏览器不支持 HTML5 video。
      </video>
    </div>

    <div class="card v5">
      <div class="hd">
        <div class="h">Baroc</div>
        <div class="small" id="videoLabel5">baroc_100ms.mp4</div>
      </div>
      <video id="player5" controls playsinline preload="metadata">
        <source src="https://github.com/mercy-lmx/video-demo/releases/download/v1/baroc_100ms.mp4?raw=1" type="video/mp4" />
        你的浏览器不支持 HTML5 video。
      </video>
    </div>

    <!-- ✅ 新增第 6 个视频：sample.mp4 -->
    <div class="card v6">
      <div class="hd">
        <div class="h">Grace</div>
        <div class="small" id="videoLabel6">sample.mp4</div>
      </div>
      <video id="player6" controls playsinline preload="metadata">
        <source src="https://github.com/mercy-lmx/video-demo/releases/download/v1/grace_100ms.mp4?raw=1" type="video/mp4" />
        你的浏览器不支持 HTML5 video。
      </video>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const videos = [
    document.getElementById('player1'),
    document.getElementById('player2'),
    document.getElementById('player3'),
    document.getElementById('player4'),
    document.getElementById('player5'),
    document.getElementById('player6'),
  ];

  const toastEl = document.getElementById('toast');
  function toast(msg){
    if(!toastEl) return;
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.style.display = 'none', 1600);
  }

  function safeSetTime(v, t){
    try { v.currentTime = t; } catch(e) {}
  }

  function syncTo(ref){
    const t = ref?.currentTime || 0;
    videos.forEach(v => v && safeSetTime(v, t));
    toast(`已同步到 ${t.toFixed(2)}s`);
  }

  async function playAll(){
    // 建议：只保留一个有声
    videos.forEach(v => { if (v) v.muted = true; });

    // 先对齐再播放
    syncTo(videos[0]);

    const results = await Promise.allSettled(
      videos.map(v => v && v.play ? v.play() : Promise.reject(new Error('invalid video')))
    );

    // 让第一个视频有声音（可选）
    if (videos[0]) videos[0].muted = false;

    const ok = results.filter(r => r.status === 'fulfilled').length;
    const fail = results.length - ok;
    toast(fail ? `播放成功 ${ok} 个，失败 ${fail} 个（可能未缓冲或被策略拦截）` : `已全部播放 (${ok})`);
  }

  function pauseAll(){
    videos.forEach(v => v && v.pause && v.pause());
    toast('已全部暂停');
  }

  function resetAll(){
    videos.forEach(v => {
      if(!v) return;
      v.pause();
      safeSetTime(v, 0);
    });
    toast('已全部回到开头');
  }

  document.getElementById('btnPlayAll')?.addEventListener('click', playAll);
  document.getElementById('btnPauseAll')?.addEventListener('click', pauseAll);
  document.getElementById('btnSyncTo1')?.addEventListener('click', () => syncTo(videos[0]));
  document.getElementById('btnResetAll')?.addEventListener('click', resetAll);
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Quality Study</title>
<style>
body{
  background:#0b0f17;
  color:#fff;
  font-family:sans-serif;
  margin:24px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  align-items:start;
}
.card{
  background:#121a2a;
  padding:10px;
  border-radius:10px;
}
iframe{
  width:100%;
  height:220px;
  border:0;
  border-radius:8px;
  background:#000;
}
.rating{
  margin-top:10px;
}
.rating label{
  margin-right:10px;
}
button{
  margin-top:24px;
  padding:10px 18px;
  font-size:16px;
  cursor:pointer;
}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<h2>Video Quality Study</h2>
<p>
Please watch all videos carefully and rate each video from 1 to 5 based on your overall viewing experience.
</p>
<p>
1 = Bad, 2 = Poor, 3 = Fair, 4 = Good, 5 = Excellent.
</p>

<div class="grid">

<h3>Video 1</h3>

<label><input type="radio" name="s1" value="1">1</label>
<label><input type="radio" name="s1" value="2">2</label>
<label><input type="radio" name="s1" value="3">3</label>
<label><input type="radio" name="s1" value="4">4</label>

</div>
</div>

<div class="rating">
<label><input type="radio" name="s7" value="1">1</label>

<label><input type="radio" name="s7" value="3">3</label>
<label><input type="radio" name="s7" value="4">4</label>
<label><input type="radio" name="s7" value="5">5</label>
</div>
</div>

</div>

<button onclick="submitAll()">Submit</button>

<script>
function getScore(i){
  const r = document.querySelector(`input[name="s${i}"]:checked`);
  return r ? r.value : null;
}

function generateCode(){
  const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase();
  const timePart = Date.now().toString().slice(-5);
  return "mtvideo" + timePart + randomPart;
}

function submitAll(){
  let scores = [];
  for(let i=1;i<=7;i++){
    let s = getScore(i);
    if(!s){
      alert("Please rate all videos before submitting.");
      return;
    }
    scores.push(s);
  }

  let code = generateCode();

  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf4YDJ0sZQEpiDz4M4VXZa9PGACwS4AP4qNn423l_bficFiAw/formResponse";

  const data = new FormData();
  data.append("entry.16441556", scores[0]);
  data.append("entry.2025751820", scores[1]);
  data.append("entry.1793582851", scores[2]);
  data.append("entry.458650404", scores[3]);
  data.append("entry.1719923684", scores[4]);
  data.append("entry.418349952", scores[5]);
  data.append("entry.1934328220", scores[6]);
  data.append("entry.1290720256", code);

  fetch(formUrl, {method:"POST", mode:"no-cors", body:data});

  document.body.innerHTML = `
    <div style="max-width:700px;margin:80px auto;text-align:center;font-family:sans-serif;">
      <h2>Thank you!</h2>
      <p>Please copy the following completion code and submit it on MTurk.</p>
      <h1>${code}</h1>
    </div>
  `;
}
</script>

</body>
</html>
